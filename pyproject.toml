[project]
name = "license-plate-recognition"
version = "0.1.0"
description = "An application that can read license plate from images and display information about them"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tensorflow>=2.22.0rc0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
